plugins { id 'com.android.application' }

android {
    namespace 'vic.software.androidsquadron'
    compileSdk 36

    defaultConfig {
        applicationId 'vic.software.androidsquadron'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.1-android16'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileSdkMinor 1
    buildToolsVersion '36.0.0'
}
